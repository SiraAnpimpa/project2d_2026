<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="description" content="Game Lab 4 is a dark 2D platformer web build with traps, combat, and a survival story.">
		<title>Game Lab 4 | 2D Platformer</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #f7f1ff;
	background: radial-gradient(ellipse at top, #342246 0%, #080b12 60%, #000000 100%);
	font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	background: #000;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background: rgba(2, 4, 8, 0.84);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	padding: 1.5rem;
	backdrop-filter: blur(8px);
}

#status-card {
	max-width: min(560px, 92vw);
	width: 100%;
	padding: 2rem 2rem 1.5rem;
	border-radius: 1.4rem;
	border: 1px solid rgba(255, 255, 255, 0.14);
	background: linear-gradient(145deg, rgba(31, 19, 45, 0.96), rgba(10, 10, 18, 0.98));
	box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
	text-align: center;
	position: relative;
	overflow: hidden;
	backdrop-filter: blur(6px);
}

#status-card::before {
	content: "";
	position: absolute;
	inset: 0;
	background: linear-gradient(120deg, rgba(136, 240, 255, 0.08), transparent 40%, rgba(255, 255, 255, 0.04));
	pointer-events: none;
}

#status-card::after {
	content: "";
	position: absolute;
	left: -20%;
	top: -40%;
	width: 140%;
	height: 140%;
	background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
	animation: pulseGlow 6s ease-in-out infinite;
	pointer-events: none;
}

@keyframes pulseGlow {
	0%, 100% { transform: scale(0.95); opacity: 0.7; }
	50% { transform: scale(1.05); opacity: 1; }
}

#status-title {
	font-size: clamp(2rem, 4vw, 2.8rem);
	font-weight: 700;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	margin-bottom: 0.45rem;
	text-shadow: 0 0 16px rgba(136, 240, 255, 0.25);
	background: linear-gradient(90deg, #ffffff, #9feeff 45%, #b6a7ff 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	background-clip: text;
}

#status-subtitle {
	font-size: 1rem;
	color: #b7aee0;
	margin-bottom: 1rem;
	letter-spacing: 0.04em;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	border-radius: 1rem;
	box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
	border: 1px solid rgba(255, 255, 255, 0.08);
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: auto;
	width: min(100%, 320px);
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: min(70%, 320px);
	margin: 0 auto;
	appearance: none;
	height: 10px;
	border-radius: 999px;
	overflow: hidden;
	background: rgba(255, 255, 255, 0.15);
}

#status-progress::-webkit-progress-bar {
	background: rgba(255, 255, 255, 0.15);
	border-radius: 999px;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #88f0ff, #6f68ff);
	border-radius: 999px;
}

#status-notice {
	background: rgba(255, 255, 255, 0.08);
	border-radius: 0.75rem;
	border: 1px solid rgba(255, 255, 255, 0.16);
	color: #f2ecff;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.4;
	margin: 1rem 0 0;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#status-copy {
	margin-top: 1rem;
	font-size: 0.95rem;
	color: #d9d0f3;
	line-height: 1.6;
	padding: 0 0.4rem;
}

#status-hint {
	margin-top: 0.75rem;
	font-size: 0.9rem;
	color: #9ddcff;
}

#status-footer {
	margin-top: 0.9rem;
	font-size: 0.82rem;
	color: #8e86b7;
	letter-spacing: 0.04em;
	text-transform: uppercase;
}

@media (max-width: 700px) {
	#status-card {
		padding: 1.25rem;
	}

	#status-copy {
		font-size: 0.9rem;
	}
}

kbd {
	display: inline-block;
	padding: 0.15rem 0.4rem;
	border-radius: 0.35rem;
	border: 1px solid rgba(255, 255, 255, 0.24);
	background: rgba(255, 255, 255, 0.1);
	font-size: 0.85rem;
	margin: 0 0.15rem;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status" role="status" aria-live="polite">
			<div id="status-card">
				<div id="status-title">Game Lab 4</div>
				<div id="status-subtitle">A dark 2D platformer web build</div>
				<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="Game Lab 4 splash screen">
				<progress id="status-progress"></progress>
				<div id="status-notice"></div>
				<div id="status-copy">
					Survive the crypt, dodge deadly traps, and escape the knight pursuit.
					<br>
					<strong>Controls:</strong> <kbd>A</kbd>/<kbd>D</kbd> move, <kbd>Space</kbd> jump, <kbd>X</kbd> shoot.
				</div>
				<div id="status-hint">Tip: use fullscreen for the best experience.</div>
				<div id="status-footer">Preparing your escape...</div>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2336988,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
